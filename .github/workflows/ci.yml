name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage gate
        run: pytest --cov-report=json:coverage.json

      - name: Enforce coverage ratchet policy
        run: |
          python scripts/coverage_ratchet.py \
            --coverage-json coverage.json \
            --policy .github/coverage-policy.json \
            --summary-out benchmarks/results/coverage-ratchet.md \
            --enforce-ready

      - name: Run benchmark skeleton smoke
        run: |
          ts=$(date -u +%Y%m%dT%H%M%SZ)
          python scripts/benchmark.py \
            --cases benchmarks/scenarios.json \
            --max-cases 1 \
            --output benchmarks/results/ci-skeleton-${ts}.json

      - name: Build benchmark trend report
        run: |
          python scripts/benchmark_trend.py \
            --results-dir benchmarks/results \
            --output benchmarks/results/trend.md

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-and-coverage-reports
          path: |
            benchmarks/results/*.json
            benchmarks/results/*.md
            coverage.json
